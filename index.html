var N=1,E=2,S=4,W=8;
var OPP={1:4,2:8,4:1,8:2};
var DELTA=[{bit:1,dx:0,dy:-1},{bit:2,dx:1,dy:0},{bit:4,dx:0,dy:1},{bit:8,dx:-1,dy:0}];

function openings(t,r,on){
  r=((r%4)+4)%4;
  if(t==="."||t==="empty") return 0;
  if(t==="I"||t==="R") return (r%2===0)?(N|S):(E|W);
  if(t==="L") return [N|E,E|S,S|W,W|N][r];
  if(t==="T") return [E|S|W,S|W|N,W|N|E,N|E|S][r];
  if(t==="X") return 15;
  if(t==="bat"||t==="led") return [N,E,S,W][r];
  if(t==="SW"){ if(!on) return 0; return (r%2===0)?(N|S):(E|W); }
  return 0;
}

function lsGet(k,d){ try{ var v=localStorage.getItem(k); return v===null?d:v; }catch(e){ return d; } }
function lsSet(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }
function pad2(n){ return (n<10?"0":"")+n; }
function clamp(v,a,b){ return v<a?a:v>b?b:v; }
function rr(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.beginPath(); c.moveTo(x+r,y); c.lineTo(x+w-r,y); c.arcTo(x+w,y,x+w,y+r,r);
  c.lineTo(x+w,y+h-r); c.arcTo(x+w,y+h,x+w-r,y+h,r);
  c.lineTo(x+r,y+h); c.arcTo(x,y+h,x,y+h-r,r);
  c.lineTo(x,y+r); c.arcTo(x,y,x+r,y,r); c.closePath();
}

var canvas=document.getElementById("game");
var ctx=canvas.getContext("2d");
var safeEl=document.getElementById("safe");
var TOUCH_DEV=(navigator.maxTouchPoints||0)>0||("ontouchstart" in window);
var view={scale:1,ox:0,oy:0,dpr:1,cw:0,ch:0};
var LAY={mode:"land",LWc:1280,LHc:800,u:1};

function readInsets(){
  try{ var cs=getComputedStyle(safeEl);
    return {t:parseFloat(cs.paddingTop)||0,r:parseFloat(cs.paddingRight)||0,b:parseFloat(cs.paddingBottom)||0,l:parseFloat(cs.paddingLeft)||0};
  }catch(e){ return {t:0,r:0,b:0,l:0}; }
}
function resize(){
  var cw=window.innerWidth, ch=window.innerHeight;
  var dpr=Math.min(window.devicePixelRatio||1, TOUCH_DEV?2:3);
  var budget=TOUCH_DEV?4.5e6:9e6;
  if(cw*ch*dpr*dpr>budget) dpr=Math.max(1,Math.sqrt(budget/(cw*ch)));
  canvas.width=Math.max(1,Math.round(cw*dpr));
  canvas.height=Math.max(1,Math.round(ch*dpr));
  var ins=readInsets();
  var aw=Math.max(1,cw-ins.l-ins.r), ah=Math.max(1,ch-ins.t-ins.b), s;
  if(ah/aw>=1.15){
    LAY.mode="port"; LAY.LWc=390; s=aw/390; LAY.LHc=ah/s;
    if(LAY.LHc<700){ LAY.LHc=700; s=Math.min(aw/390,ah/700); }
  } else {
    LAY.mode="land"; LAY.LWc=1280; LAY.LHc=800; s=Math.min(aw/1280,ah/800);
  }
  view={scale:s,ox:ins.l+(aw-LAY.LWc*s)/2,oy:ins.t+(ah-LAY.LHc*s)/2,dpr:dpr,cw:cw,ch:ch};
  LAY.u=clamp((TOUCH_DEV?0.7:0.5)/s,1,1.55);
}
window.addEventListener("resize",resize);
window.addEventListener("orientationchange",function(){ setTimeout(resize,120); });

// ---- audio (Ava clips) ----
var SND={ctx:null,out:null,buf:{},want:{},decoded:0,failed:0,unlocked:false,played:[]};
function sndInit(){
  if(SND.ctx) return;
  var AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  try{ SND.ctx=new AC(); }catch(e){ SND.ctx=null; return; }
  SND.out=SND.ctx.createGain(); SND.out.gain.value=0.9; SND.out.connect(SND.ctx.destination);
  Object.keys(SND_SRC).forEach(function(name){
    try{
      var bin=atob(SND_SRC[name]), u8=new Uint8Array(bin.length);
      for(var i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
      var ok=function(b){ SND.buf[name]=b; SND.decoded++; if(SND.want[name]&&performance.now()-SND.want[name]<600){ delete SND.want[name]; sndStart(name); } };
      var p=SND.ctx.decodeAudioData(u8.buffer,ok,function(){ SND.failed++; });
      if(p&&p.catch) p.catch(function(){});
    }catch(e){ SND.failed++; }
  });
}
function sndUnlock(){
  sndInit(); var c=SND.ctx; if(!c) return;
  try{
    if(c.state!=="running"&&c.resume){ var r=c.resume(); if(r&&r.catch) r.catch(function(){}); }
    if(!SND.unlocked){ var b=c.createBuffer(1,1,22050), src=c.createBufferSource(); src.buffer=b; src.connect(c.destination); src.start(0); SND.unlocked=true; }
  }catch(e){}
}
["keydown","pointerdown","touchend","mousedown","click"].forEach(function(ev){ window.addEventListener(ev,sndUnlock,true); });
function sndStart(name){ try{ var src=SND.ctx.createBufferSource(); src.buffer=SND.buf[name]; src.connect(SND.out); src.start(0); }catch(e){} }
function playSnd(name){
  SND.played.push(name); if(SND.played.length>50) SND.played.shift();
  if(!SND.ctx) return;
  if(SND.buf[name]) sndStart(name); else SND.want[name]=performance.now();
}

// ---- game state ----
var G={
  screen:"start", // start | game | win | allclear
  level:0, moves:0, t0:0, elapsed:0,
  tiles:[], w:0, h:0, lit:{}, ledOn:{},
  cursor:{x:0,y:0},
  winT:0, msg:"", msgT:0,
  paused:false, touchUI:TOUCH_DEV,
  buttons:[], field:null, cell:0, gap:0,
  prevLedCount:0,
  sessionStarted:false // los-gehts only on first game start of this page session
};

function loadLevel(idx){
  var L=LEVELS[idx]; if(!L) return;
  G.level=idx; G.w=L.w; G.h=L.h; G.moves=0; G.t0=performance.now(); G.elapsed=0;
  G.tiles=L.tiles.map(function(c){ return {t:c.t,r:c.r|0,on:c.t==="SW"?!!c.on:true}; });
  G.cursor={x:0,y:0}; G.winT=0; G.screen="game"; G.paused=false; G.prevLedCount=0;
  // place cursor on first rotatable/switch
  for(var i=0;i<G.tiles.length;i++){
    var c=G.tiles[i];
    if(c.t==="."||c.t==="empty") continue;
    if(c.t!=="bat"&&c.t!=="led"&&c.t!=="."&&c.t!=="empty"){ G.cursor={x:i%G.w,y:(i/G.w)|0}; break; }
  }
  recompute();
  if(!G.sessionStarted){ G.sessionStarted=true; playSnd("los-gehts"); }
  lsSet(LS_LEVEL, String(idx));
}

function recompute(){
  var lit={}, q=[], seen={};
  for(var y=0;y<G.h;y++) for(var x=0;x<G.w;x++){
    var i=y*G.w+x; if(G.tiles[i].t==="bat"){ q.push([x,y]); seen[x+","+y]=1; lit[x+","+y]=1; }
  }
  while(q.length){
    var p=q.shift(), x=p[0], y=p[1], c=G.tiles[y*G.w+x];
    var op=openings(c.t,c.r,c.on);
    for(var d=0;d<4;d++){
      var D=DELTA[d]; if(!(op&D.bit)) continue;
      var nx=x+D.dx, ny=y+D.dy; if(nx<0||ny<0||nx>=G.w||ny>=G.h) continue;
      var key=nx+","+ny; if(seen[key]) continue;
      var n=G.tiles[ny*G.w+nx];
      if(openings(n.t,n.r,n.on)&OPP[D.bit]){ seen[key]=1; lit[key]=1; q.push([nx,ny]); }
    }
  }
  G.lit=lit;
  var ledOn={}, nOn=0, nLed=0;
  for(y=0;y<G.h;y++) for(x=0;x<G.w;x++){
    i=y*G.w+x; if(G.tiles[i].t==="led"){ nLed++; if(lit[x+","+y]){ ledOn[x+","+y]=1; nOn++; } }
  }
  G.ledOn=ledOn; G.nLed=nLed; G.nOn=nOn;
  G.prevLedCount=nOn;
  if(nLed>0&&nOn===nLed&&G.screen==="game"&&G.winT<=0){
    G.winT=0.01; playSnd("prima");
  }
}

function activateTile(x,y){
  if(G.screen!=="game"||G.paused||G.winT>0) return false;
  var i=y*G.w+x; if(i<0||i>=G.tiles.length) return false;
  var c=G.tiles[i];
  if(c.t==="."||c.t==="empty"||c.t==="bat"||c.t==="led") return false;
  if(c.t==="SW"){
    // Rotate like a straight; always close the switch so a correct orientation conducts.
    c.r=(c.r+1)%4;
    c.on=true;
    G.moves++; recompute(); return true;
  }
  c.r=(c.r+1)%4; G.moves++; recompute(); return true;
}

function toggleSwitch(x,y){
  var i=y*G.w+x; var c=G.tiles[i];
  if(c.t!=="SW") return false;
  c.on=!c.on; G.moves++; recompute(); return true;
}

function fmtTime(ms){
  var s=Math.floor(ms/1000), m=(s/60)|0; s=s%60;
  return m+":"+pad2(s);
}

// ---- drawing tiles (classic: white board, grey→pink) ----
function drawTileAt(c, x0,y0,size, tile, lit){
  var kind=tile.t, rot=tile.r, on=tile.on;
  if(kind==="."||kind==="empty"){
    // empty: light border only
    c.save();
    rr(c,x0+size*0.03,y0+size*0.03,size*0.94,size*0.94,size*0.1);
    c.strokeStyle="rgba(228,228,228,1)"; c.lineWidth=Math.max(1,size/50); c.stroke();
    c.restore(); return;
  }
  var m=openings(kind,rot, kind==="SW"?on:true);
  // For drawing SW when off, still show the trace shape faintly but grey and dashed? Show shape as if on but unpowered grey, with gap.
  var drawM = kind==="SW" ? openings("I",rot,true) : m;
  if(kind==="SW"&&!on) lit=false;

  var cx=x0+size/2, cy=y0+size/2, tw=size*0.24, pad_r=size*0.095, inset=Math.max(1,size*0.03);
  var trace=lit?PINK:GREY, pad=lit?COPPER_LIT:COPPER;

  c.save();
  rr(c,x0+inset,y0+inset,size-2*inset,size-2*inset,size*0.1);
  c.fillStyle="rgb(250,250,250)"; c.fill();
  c.strokeStyle="rgb(228,228,228)"; c.lineWidth=Math.max(1,size/50); c.stroke();

  if(lit){
    // Glow follows the same path as the trace (curve or arms), just thicker/softer
    c.save(); c.globalAlpha=0.35; c.shadowColor=PINK; c.shadowBlur=size*0.22;
    if(kind==="L") drawCurve(c,cx,cy,size,tw*1.8,drawM,PINK);
    else drawArms(c,cx,cy,size,tw*1.8,drawM,PINK);
    c.restore();
  }

  if(kind==="L"){
    drawCurve(c,cx,cy,size,tw,drawM,trace);
  } else if(kind==="R"){
    drawArms(c,cx,cy,size,tw,drawM,trace);
    // zig-zag resistor body
    c.save();
    c.translate(cx,cy);
    if(rot%2===1) c.rotate(Math.PI/2);
    c.strokeStyle=trace; c.lineWidth=tw*0.55; c.lineJoin="round"; c.beginPath();
    var zs=size*0.12;
    c.moveTo(-zs*1.6,0);
    for(var zi=0;zi<4;zi++){ c.lineTo(-zs*1.2+zi*zs*0.8, (zi%2===0?-1:1)*zs*0.7); }
    c.lineTo(zs*1.6,0); c.stroke();
    c.restore();
  } else if(kind==="SW"){
    drawArms(c,cx,cy,size,tw,drawM,trace);
    // switch lever
    c.save();
    c.fillStyle=on?PINK:GREY;
    c.beginPath(); c.arc(cx,cy,tw*0.55,0,Math.PI*2); c.fill();
    c.strokeStyle=on?PINK:GREY; c.lineWidth=tw*0.45; c.lineCap="round";
    c.beginPath();
    if(on){ c.moveTo(cx,cy); c.lineTo(cx+(rot%2===0?0:size*0.22), cy+(rot%2===0?size*0.22:0)); }
    else { c.moveTo(cx,cy); c.lineTo(cx+size*0.18, cy-size*0.14); }
    c.stroke();
    c.restore();
  } else if(kind==="bat"){
    drawArms(c,cx,cy,size,tw,drawM,trace);
    var bw=size*0.46, bh=size*0.30;
    var bx=cx-bw/2-size*0.02, by=cy-bh/2;
    rr(c,bx,by,bw,bh,size*0.05); c.fillStyle=PINK; c.fill();
    rr(c,bx+bw-1,by+bh*0.28,size*0.07,bh*0.44,size*0.02); c.fill();
    c.fillStyle=WHITE;
    var ps=size*0.09, thick=size*0.035;
    c.fillRect(cx-size*0.02-thick/2, cy-ps, thick, ps*2);
    c.fillRect(cx-size*0.02-ps, cy-thick/2, ps*2, thick);
  } else if(kind==="led"){
    drawArms(c,cx,cy,size,tw,drawM,trace);
    var lr=size*0.30;
    if(lit){
      c.save(); c.globalAlpha=0.45; c.fillStyle="#ff64be";
      c.beginPath(); c.arc(cx,cy,lr*1.6,0,Math.PI*2); c.fill(); c.restore();
      c.fillStyle="#ff46aa"; c.beginPath(); c.arc(cx,cy,lr,0,Math.PI*2); c.fill();
      c.fillStyle="rgba(255,230,245,0.9)"; c.beginPath(); c.ellipse(cx-lr*0.1,cy-lr*0.2,lr*0.4,lr*0.35,0,0,Math.PI*2); c.fill();
    } else {
      c.fillStyle="#969696"; c.beginPath(); c.arc(cx,cy,lr,0,Math.PI*2); c.fill();
      c.fillStyle="rgba(210,210,210,0.8)"; c.beginPath(); c.ellipse(cx-lr*0.1,cy-lr*0.2,lr*0.35,lr*0.3,0,0,Math.PI*2); c.fill();
      c.strokeStyle="#6e6e6e"; c.lineWidth=Math.max(1,size/40); c.beginPath(); c.arc(cx,cy,lr,0,Math.PI*2); c.stroke();
    }
    c.fillStyle=GREY; c.fillRect(cx-lr*0.65, cy+lr*0.58, lr*1.3, lr*0.2);
  } else {
    // I T X
    drawArms(c,cx,cy,size,tw,drawM,trace);
    c.fillStyle=trace;
    c.beginPath(); c.arc(cx,cy, kind==="T"||kind==="X"?tw*0.55:tw/2, 0, Math.PI*2); c.fill();
  }

  // pads
  for(var d=0;d<4;d++){
    var bit=DELTA[d].bit;
    if(!(drawM&bit)) continue;
    if(kind==="SW"&&!on) continue;
    var pr=pad_r, px,py;
    if(bit===1){ px=cx; py=y0+pr*0.9; }
    else if(bit===2){ px=x0+size-pr*0.9; py=cy; }
    else if(bit===4){ px=cx; py=y0+size-pr*0.9; }
    else { px=x0+pr*0.9; py=cy; }
    c.fillStyle=pad; c.beginPath(); c.arc(px,py,pr,0,Math.PI*2); c.fill();
    c.fillStyle="rgba(255,255,255,0.9)"; c.beginPath(); c.arc(px,py,pr*0.32,0,Math.PI*2); c.fill();
  }

  c.restore();
}

function drawArms(c,cx,cy,size,tw,m,col){
  var half=tw/2, x0=cx-size/2, y0=cy-size/2;
  c.fillStyle=col;
  if(m&1) c.fillRect(cx-half, y0, tw, size/2);
  if(m&2) c.fillRect(cx, cy-half, size/2, tw);
  if(m&4) c.fillRect(cx-half, cy, tw, size/2);
  if(m&8) c.fillRect(x0, cy-half, size/2, tw);
}

function curveCorner(cx,cy,size,m){
  // Shared corner for an L connecting two adjacent sides; radius = size/2 hits both edge midpoints.
  var x0=cx-size/2, y0=cy-size/2;
  if(m===3)  return {x:x0+size, y:y0,       a0:Math.PI/2,       a1:Math.PI};           // N|E → top-right
  if(m===6)  return {x:x0+size, y:y0+size,  a0:Math.PI,         a1:Math.PI*1.5};       // E|S → bottom-right
  if(m===12) return {x:x0,      y:y0+size,  a0:Math.PI*1.5,     a1:Math.PI*2};         // S|W → bottom-left
  if(m===9)  return {x:x0,      y:y0,       a0:0,               a1:Math.PI/2};         // W|N → top-left
  return null;
}
function drawCurve(c,cx,cy,size,tw,m,col){
  // Quarter-circle stroke centered at the shared corner (not the cell center).
  // Concave toward that corner; same stroke width as straight traces; identical for pink/grey.
  var cr=curveCorner(cx,cy,size,m);
  if(!cr){ drawArms(c,cx,cy,size,tw,m,col); return; }
  c.save();
  c.strokeStyle=col; c.lineWidth=tw; c.lineCap="butt"; c.lineJoin="round";
  c.beginPath();
  c.arc(cr.x, cr.y, size*0.5, cr.a0, cr.a1, false); // clockwise short quarter through cell interior
  c.stroke();
  c.restore();
}

// ---- logo: BEAK + readable Leiterbahn ----
// Nunito Light Italic embedded; opacity raised for legibility (was ~55%/0.55 — too faint on pink, especially iPhone)
function drawLogo(cx, y, beakH){
  var c=ctx;
  c.save();
  c.textAlign="left"; c.textBaseline="alphabetic";
  c.fillStyle=WHITE;
  var beakSize=beakH*0.92;
  c.font=beakSize+"px Aeonis";
  var letters=["B","E","A","K"], gap=beakSize*0.18;
  var widths=[], total=0, i, ch;
  for(i=0;i<letters.length;i++){ widths[i]=c.measureText(letters[i]).width; total+=widths[i]+(i?gap:0); }
  var dotR=beakSize*0.07;
  total += gap*0.7 + dotR*2;
  // subtitle — larger & higher contrast for readability on #dd007a
  var sub="Leiterbahn";
  // Readable on pink: landscape/desktop subtitle ~same visual weight as iPhone start (NunitoLI is thin → go large)
  var subSize=Math.max(beakSize*(LAY.mode==="port"?0.55:0.90), LAY.mode==="port"?22:36);
  var cssMin=(LAY.mode==="port"?16:26)/view.scale; if(subSize<cssMin) subSize=cssMin;
  c.font=subSize+"px NunitoLI";
  var track=subSize*0.10, subW=0;
  for(i=0;i<sub.length;i++) subW+=c.measureText(sub[i]).width+(i<sub.length-1?track:0);
  var gapLogo=beakSize*0.28;
  var fullW=total+gapLogo+subW;
  var x=cx-fullW/2;
  // draw BEAK
  c.font=beakSize+"px Aeonis"; c.fillStyle=WHITE; c.globalAlpha=1;
  var baseline=y+beakSize*0.82;
  for(i=0;i<letters.length;i++){ c.fillText(letters[i], x, baseline); x+=widths[i]+gap; }
  // white dot
  c.beginPath(); c.arc(x+dotR, baseline-beakSize*0.28, dotR, 0, Math.PI*2); c.fill();
  x+=dotR*2+gapLogo;
  // opacity 0.92 (mockup was ~0.55 / alpha 140 — too faint on #dd007a, especially iPhone)
  c.font=subSize+"px NunitoLI"; c.globalAlpha=0.92; c.fillStyle=WHITE;
  for(i=0;i<sub.length;i++){ c.fillText(sub[i], x, baseline); x+=c.measureText(sub[i]).width+track; }
  c.globalAlpha=1;
  c.restore();
  return {w:fullW, h:beakH};
}

function layoutField(){
  var Lw=LAY.LWc, Lh=LAY.LHc, u=LAY.u;
  var field, side;
  if(LAY.mode==="port"){
    var top=Math.max(10,(Lh-700)*0.15)+48*u;
    var boardMaxW=Lw-24;
    var boardMaxH=Lh-top-210*u;
    var gap=4, cell=Math.floor(Math.min((boardMaxW-(G.w+1)*gap)/G.w,(boardMaxH-(G.h+1)*gap)/G.h));
    cell=Math.max(28,cell);
    var bw=G.w*cell+(G.w+1)*gap, bh=G.h*cell+(G.h+1)*gap;
    field={x:(Lw-bw)/2, y:top+8, w:bw, h:bh, r:10};
    G.cell=cell; G.gap=gap;
    G.hudY=field.y+field.h+18*u;
    LAY.logo={cx:Lw/2, y:12*u, h:28*u};
  } else {
    var margin=40, top=72;
    var fieldW=840, fieldH=640;
    gap=5;
    cell=Math.floor(Math.min((fieldW-48-(G.w+1)*gap)/G.w,(fieldH-48-(G.h+1)*gap)/G.h));
    cell=Math.max(36,cell);
    bw=G.w*cell+(G.w+1)*gap; bh=G.h*cell+(G.h+1)*gap;
    field={x:margin+(fieldW-bw)/2, y:top+(fieldH-bh)/2, w:bw, h:bh, r:12,
           cardX:margin, cardY:top, cardW:fieldW, cardH:fieldH};
    G.cell=cell; G.gap=gap;
    LAY.logo={cx:margin+fieldW/2, y:18, h:36}; // will right-align visually near card
    LAY.sideX=margin+fieldW+44;
  }
  G.field=field;
}

function cellAt(x,y){
  var f=G.field, gap=G.gap, cell=G.cell;
  return {x:f.x+gap+x*(cell+gap), y:f.y+gap+y*(cell+gap)};
}

function drawField(){
  var c=ctx, f=G.field;
  c.save();
  if(LAY.mode==="land"){
    rr(c,f.cardX,f.cardY,f.cardW,f.cardH,12); c.fillStyle=WHITE; c.fill();
  } else {
    rr(c,f.x-8,f.y-8,f.w+16,f.h+16,12); c.fillStyle=WHITE; c.fill();
  }
  for(var y=0;y<G.h;y++) for(var x=0;x<G.w;x++){
    var i=y*G.w+x, t=G.tiles[i], p=cellAt(x,y);
    var isLit=!!G.lit[x+","+y] && t.t!=="." && t.t!=="empty";
    if(t.t==="SW"&&!t.on) isLit=false;
    drawTileAt(c,p.x,p.y,G.cell,t,isLit);
  }
  // cursor
  if(G.screen==="game"&&!G.touchUI){
    var cp=cellAt(G.cursor.x,G.cursor.y);
    c.strokeStyle=PINK; c.lineWidth=3; c.globalAlpha=0.85;
    rr(c,cp.x+2,cp.y+2,G.cell-4,G.cell-4,G.cell*0.1); c.stroke();
    c.globalAlpha=1;
  }
  c.restore();
}

function drawHUD(){
  var c=ctx, u=LAY.u;
  if(LAY.mode==="port") return drawHUDPortrait();
  var hx=LAY.sideX, y=G.field.cardY+4;
  c.fillStyle=WHITE; c.fillRect(hx-31, G.field.cardY, 2, G.field.cardH);
  function item(lab,val,size){
    c.fillStyle=WHITE; c.textAlign="left"; c.textBaseline="alphabetic";
    c.font=(17*u)+"px NunitoLI"; c.fillText(lab,hx,y+17*u); y+=26*u;
    c.font=(size*u)+"px NunitoSB"; c.fillText(val,hx,y+size*u*0.85); y+=52*u;
  }
  item("level", pad2(G.level+1), 40);
  item("züge", String(G.moves), 40);
  item("zeit", fmtTime(G.elapsed), 40);
  c.font=(17*u)+"px NunitoLI"; c.fillText("leds",hx,y+17*u); y+=30*u;
  for(var i=0;i<G.nLed;i++){
    var on=i<G.nOn, cx=hx+12*u+i*34*u, cy=y+10*u, r=10*u;
    c.beginPath(); c.arc(cx,cy,r,0,Math.PI*2);
    if(on){ c.fillStyle=WHITE; c.fill(); }
    else { c.strokeStyle=WHITE; c.lineWidth=2; c.stroke(); }
  }
  var hy1=G.field.cardY+G.field.cardH-58*u;
  c.font=(13*u)+"px NunitoLI"; c.fillStyle=WHITE; c.globalAlpha=0.75;
  c.fillText(G.touchUI?"tippen: kachel drehen (akku/led fest)":"leertaste/enter: drehen  ·  pfeiltasten", hx, hy1);
  c.fillText("r: neustart  ·  n: nächstes (dev)", hx, hy1+20*u);
  c.globalAlpha=0.7; c.fillText(CREDIT, hx, G.field.cardY+G.field.cardH-22*u);
  c.globalAlpha=0.55; c.font=(11*u)+"px NunitoLI"; c.fillText(VERSION, hx, G.field.cardY+G.field.cardH-6*u);
  c.globalAlpha=1;
}

function drawHUDPortrait(){
  var c=ctx, u=LAY.u, y=G.hudY, Lw=LAY.LWc;
  var cols=[["level",pad2(G.level+1)],["züge",String(G.moves)],["zeit",fmtTime(G.elapsed)],["leds",null]];
  var colW=(Lw-20)/4;
  cols.forEach(function(col,i){
    var x=10+i*colW;
    c.fillStyle=WHITE; c.textAlign="left";
    c.font=(13*u)+"px NunitoLI"; c.fillText(col[0],x,y);
    if(col[1]!==null){ c.font=(22*u)+"px NunitoSB"; c.fillText(col[1],x,y+28*u); }
    else {
      for(var k=0;k<G.nLed;k++){
        var on=k<G.nOn, cx=x+8*u+k*22*u, cy=y+22*u, r=7*u;
        c.beginPath(); c.arc(cx,cy,r,0,Math.PI*2);
        if(on){ c.fill(); } else { c.strokeStyle=WHITE; c.lineWidth=1.5; c.stroke(); c.fillStyle=WHITE; }
      }
    }
  });
  c.textAlign="center"; c.font=(12*u)+"px NunitoLI"; c.globalAlpha=0.8; c.fillStyle=WHITE;
  c.fillText(G.touchUI?"tippen: kachel drehen (akku/led fest)":"leertaste: drehen", Lw/2, y+58*u);
  c.globalAlpha=0.75; c.fillText(CREDIT, Lw/2, y+78*u);
  c.globalAlpha=0.5; c.font=(10*u)+"px NunitoLI"; c.fillText(VERSION, Lw/2, y+94*u);
  c.globalAlpha=1;
}

function drawWinOverlay(){
  if(G.winT<=0) return;
  var c=ctx, f=G.field;
  var cx=f.x+f.w/2, cy=f.y+f.h*0.48;
  var msg="Prima!", sub="level "+pad2(G.level+1)+"  ·  "+G.moves+" züge";
  c.save();
  c.font="58px NunitoSB"; var mw=c.measureText(msg).width;
  rr(c,cx-mw/2-40, cy-40, mw+80, 100, 18); c.fillStyle="rgba(255,255,255,0.94)"; c.fill();

  c.fillText(msg,cx,cy-6);
  c.font="20px NunitoLI"; c.fillStyle=GREY; c.fillText(sub,cx,cy+34);
  c.restore();
}


function fitText(c, text, maxW, maxFs, family){
  var fs=maxFs;
  c.font=fs+"px "+family;
  while(fs>11 && c.measureText(text).width>maxW){ fs-=1; c.font=fs+"px "+family; }
  return fs;
}

function render(){
  var c=ctx, dpr=view.dpr;
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,view.cw,view.ch);
  c.fillStyle=PINK; c.fillRect(0,0,view.cw,view.ch);
  c.setTransform(dpr*view.scale,0,0,dpr*view.scale, dpr*view.ox, dpr*view.oy);
  if(G.screen==="start"){ drawStart(); return; }
  if(G.screen==="allclear"){ drawAllClear(); return; }
  layoutField();
  // logo
  if(LAY.mode==="land"){
    // right-align-ish above card
    drawLogo(G.field.cardX+G.field.cardW*0.72, 10, 42);
  } else {
    drawLogo(LAY.logo.cx, LAY.logo.y, LAY.logo.h);
  }
  drawField();
  drawHUD();
  drawWinOverlay();
  if(G.paused){
    c.fillStyle="rgba(221,0,122,0.55)"; c.fillRect(0,0,LAY.LWc,LAY.LHc);
    c.fillStyle=WHITE; c.font="40px NunitoSB"; c.textAlign="center"; c.fillText("Pause", LAY.LWc/2, LAY.LHc/2);
  }
}

function update(dt){
  if(G.screen==="game"&&!G.paused&&G.winT<=0) G.elapsed=performance.now()-G.t0;
  if(G.winT>0){
    G.winT+=dt;
    if(G.winT>1.6){
      if(G.level+1>=LEVELS.length){ G.screen="allclear"; G.winT=0; lsSet(LS_LEVEL,"0"); }
      else { loadLevel(G.level+1); }
    }
  }
}

var last=performance.now();
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000); last=now;
  update(dt); render();
  requestAnimationFrame(frame);
}

// ---- input ----
function toLogic(clientX,clientY){
  return {x:(clientX-view.ox)/view.scale, y:(clientY-view.oy)/view.scale};
}
function hitTile(lx,ly){
  if(!G.field) return null;
  for(var y=0;y<G.h;y++) for(var x=0;x<G.w;x++){
    var p=cellAt(x,y);
    if(lx>=p.x&&lx<=p.x+G.cell&&ly>=p.y&&ly<=p.y+G.cell) return {x:x,y:y};
  }
  return null;
}
function hitButton(lx,ly){
  for(var i=0;i<G.buttons.length;i++){
    var b=G.buttons[i];
    if(lx>=b.x&&lx<=b.x+b.w&&ly>=b.y&&ly<=b.y+b.h) return b;
  }
  return null;
}

canvas.addEventListener("pointerdown",function(e){
  G.touchUI = G.touchUI || e.pointerType==="touch";
  canvas.setPointerCapture&&canvas.setPointerCapture(e.pointerId);
  var p=toLogic(e.clientX,e.clientY);
  if(G.screen==="start"||G.screen==="allclear"){
    var b=hitButton(p.x,p.y); if(b) b.act(); return;
  }
  if(G.paused){ G.paused=false; return; }
  if(G.winT>0) return;
  var t=hitTile(p.x,p.y);
  if(t){
    G.cursor={x:t.x,y:t.y};
    var tile=G.tiles[t.y*G.w+t.x];
    activateTile(t.x,t.y);
  }
});

window.addEventListener("keydown",function(e){
  var k=e.key;
  if(G.screen==="start"){
    if(k==="Enter"||k===" "){ e.preventDefault(); var saved=parseInt(lsGet(LS_LEVEL,"0"),10)||0; loadLevel(saved>0&&saved<LEVELS.length?saved:0); }
    return;
  }
  if(G.screen==="allclear"){
    if(k==="Enter"||k===" "){ e.preventDefault(); loadLevel(0); }
    return;
  }
  if(k==="p"||k==="P"||k==="Escape"){ G.paused=!G.paused; e.preventDefault(); return; }
  if(G.paused||G.winT>0) return;
  if(k==="r"||k==="R"){ e.preventDefault(); loadLevel(G.level); return; }
  var dx=0,dy=0;
  if(k==="ArrowLeft"||k==="a"||k==="A") dx=-1;
  if(k==="ArrowRight"||k==="d"||k==="D") dx=1;
  if(k==="ArrowUp"||k==="w"||k==="W") dy=-1;
  if(k==="ArrowDown"||k==="s"||k==="S") dy=1;
  if(dx||dy){
    e.preventDefault();
    G.cursor.x=clamp(G.cursor.x+dx,0,G.w-1);
    G.cursor.y=clamp(G.cursor.y+dy,0,G.h-1);
    return;
  }
  if(k===" "||k==="Enter"){
    e.preventDefault();
    var tile=G.tiles[G.cursor.y*G.w+G.cursor.x];
    activateTile(G.cursor.x,G.cursor.y);
  }
});

document.addEventListener("touchmove",function(e){ e.preventDefault(); },{passive:false});
document.addEventListener("gesturestart",function(e){ e.preventDefault(); },{passive:false});

// ---- test API ----
function applySolution(){
  var L=LEVELS[G.level]; if(!L||!L.solution) return false;
  L.solution.forEach(function(s,i){
    if(s==null) return;
    if(typeof s==="object"){
      if("r" in s) G.tiles[i].r=s.r;
      if("on" in s) G.tiles[i].on=s.on;
    } else G.tiles[i].r=s;
  });
  G.prevLedCount=G.nOn||0;
  recompute();
  return G.nOn===G.nLed && G.nLed>0;
}

window.LEITER={
  curveCorner:curveCorner,

  resetPlayed:function(){ SND.played=[]; },
  played:function(){ return SND.played.slice(); },

  G:G, LEVELS:LEVELS, VERSION:VERSION, CREDIT:CREDIT, LAY:LAY, SND:SND, playSnd:playSnd,
  loadLevel:loadLevel, applySolution:applySolution, recompute:recompute,
  activateTile:activateTile, toggleSwitch:toggleSwitch, resize:resize,
  view:function(){ return view; },
  buttonRect:function(label){
    for(var i=0;i<G.buttons.length;i++) if(G.buttons[i].label.indexOf(label)>=0||G.buttons[i].label===label){
      var b=G.buttons[i];
      return {x:view.ox+b.x*view.scale, y:view.oy+b.y*view.scale, w:b.w*view.scale, h:b.h*view.scale,
        label:b.label, textW:b.textW||0, fontSize:b.fontSize||0, logicW:b.w, logicH:b.h};
    }
    return null;
  },
  startButtons:function(){ return G.buttons.map(function(b){ return {label:b.label,w:b.w,h:b.h,textW:b.textW||0,fontSize:b.fontSize||0}; }); },
  tileRect:function(x,y){
    layoutField(); var p=cellAt(x,y);
    return {x:view.ox+p.x*view.scale, y:view.oy+p.y*view.scale, w:G.cell*view.scale, h:G.cell*view.scale};
  }
};

resize();
requestAnimationFrame(frame);
})();

</script>
